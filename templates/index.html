<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-Driven Customer Insights tool to estimate customer value using RFM metrics (Recency and Frequency).">
    <title>Customer Insights Predictor | Customer Value Estimation</title>
    <!-- Load modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            --primary-glow: rgba(99, 102, 241, 0.15);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 24px;
        }

        /* Decorative Background Blobs */
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: var(--accent);
            filter: blur(120px);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }

        .blob-1 {
            top: 10%;
            left: 15%;
        }

        .blob-2 {
            bottom: 15%;
            right: 15%;
            background: #ec4899;
        }

        /* Container & Card */
        main {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 80px rgba(99, 102, 241, 0.05);
        }

        .card:hover {
            border-color: rgba(99, 102, 241, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 
                        0 0 100px rgba(99, 102, 241, 0.1);
        }

        /* Typography */
        header {
            text-align: center;
            margin-bottom: 36px;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.03em;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 400;
            outline: none;
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.45);
        }

        input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: rgba(15, 23, 42, 0.85);
        }

        /* Info Badge */
        .info-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
            display: block;
        }

        /* Submit Button */
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }

        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: all 0.6s ease;
        }

        button:hover::after {
            left: 100%;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }
            h1 {
                font-size: 1.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <main>
        <div class="card">
            <header>
                <h1 id="main-title">Customer Value Predictor</h1>
                <p class="subtitle">Enter customer behavioral data below to estimate their lifetime monetary value using our machine learning model.</p>
            </header>

            <form action="/predict" method="post" id="prediction-form">
                <div class="form-group">
                    <label for="recency">Recency (Days)</label>
                    <div class="input-wrapper">
                        <input type="number" step="any" id="recency" name="Recency" placeholder="e.g. 15" required min="0">
                    </div>
                    <span class="info-text">Number of days since the customer's last purchase.</span>
                </div>

                <div class="form-group">
                    <label for="frequency">Frequency (Orders)</label>
                    <div class="input-wrapper">
                        <input type="number" step="any" id="frequency" name="Frequency" placeholder="e.g. 6" required min="1">
                    </div>
                    <span class="info-text">Total number of unique orders placed by this customer.</span>
                </div>

                <div class="form-group">
                    <label for="monetary">Current Monetary Value ($)</label>
                    <div class="input-wrapper">
                        <input type="number" step="any" id="monetary" name="Monetary" placeholder="e.g. 450" required min="0">
                    </div>
                    <span class="info-text">Total amount spent by the customer to date.</span>
                </div>

                <button type="submit" id="submit-btn">Predict Future Spending</button>
            </form>
        </div>
    </main>
</body>
</html>
