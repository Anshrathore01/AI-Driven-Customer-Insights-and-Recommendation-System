<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Customer value prediction results.">
    <title>Prediction Result | Customer Value Estimation</title>
    <!-- Load modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            --primary-glow: rgba(99, 102, 241, 0.15);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 24px;
        }

        /* Background Blobs */
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: var(--accent);
            filter: blur(120px);
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .blob-1 {
            top: 15%;
            left: 20%;
            background: #10b981;
        }

        .blob-2 {
            bottom: 15%;
            right: 20%;
        }

        /* Container */
        main {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 80px rgba(16, 185, 129, 0.05);
            text-align: center;
        }

        .card:hover {
            border-color: rgba(16, 185, 129, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 
                        0 0 100px rgba(16, 185, 129, 0.1);
        }

        /* Result Graphic/Icon */
        .result-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--success);
            color: var(--success);
            font-size: 2.25rem;
            margin-bottom: 24px;
            box-shadow: 0 0 20px var(--success-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(16, 185, 129, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .prediction-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 32px;
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: inline-block;
            width: 100%;
            word-wrap: break-word;
        }

        /* Action Link */
        a {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }

        a:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <main>
        <div class="card">
            <div class="result-icon">📊</div>
            <h2>Prediction Results</h2>
            <div class="prediction-value" id="prediction-result">
                {{ prediction_text }}
            </div>
            <a href="/" id="back-btn">🔙 Back to Home</a>
        </div>
    </main>
</body>
</html>
